server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $api_upstream http://api:8000;
    location = /healthz { access_log off; return 200 "ok\n"; }
    # 项目归档后静态内容冻结（代码资产以 ?v= 版本串区分内容），全部一年期
    # 不可变缓存。API 缓存语义由后端响应头决定，这里不再强制 no-store。
    location = /index.html { add_header Cache-Control "public, max-age=31536000, immutable"; }
    # Allow a 10 MiB evidence file plus multipart overhead. The API still
    # enforces the file limit; other endpoints retain Nginx's default limit.
    location = /api/evidence {
        client_max_body_size 11m;
        proxy_pass $api_upstream;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_read_timeout 70s;
        # 玩家私有经营证据：双层保险，与后端 private, no-store 保持一致。
        add_header Cache-Control "private, no-store";
    }
    location /api/ {
        proxy_pass $api_upstream;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_read_timeout 70s;
    }
    location /auth/ {
        proxy_pass $api_upstream;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $remote_addr;
    }
    location /js/ { add_header Cache-Control "public, max-age=31536000, immutable"; }
    location /css/ { add_header Cache-Control "public, max-age=31536000, immutable"; }
    location /assets/ { add_header Cache-Control "public, max-age=31536000, immutable"; }
    location /tools/ { add_header Cache-Control "public, max-age=31536000, immutable"; }
    location / { try_files $uri $uri/ =404; }
    location ~ /tests/ { return 404; }
    location ~ ^/assets/models/(tripo/|tripo-jobs\.json$) { return 404; }
}
