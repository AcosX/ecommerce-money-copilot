name: acc-emc
services:
  db:
    image: mariadb:10.11
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: ${EMC_DEV_DB_ROOT_PASSWORD:?required}
      MARIADB_DATABASE: emc
      MARIADB_USER: emc
      MARIADB_PASSWORD: ${EMC_DEV_DB_PASSWORD:?required}
    volumes:
      - agent-db:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 20
  api:
    build:
      context: ../backend
      args:
        PYTHON_IMAGE: ${EMC_PYTHON_IMAGE:-python:3.12-slim}
    restart: unless-stopped
    env_file: ${EMC_DEV_ENV_FILE:-../backend/.env}
    environment:
      EMC_ENV: dev
      EMC_DATABASE_URL: mysql+pymysql://emc:${EMC_DEV_DB_PASSWORD}@db:3306/emc?charset=utf8mb4
      EMC_PUBLIC_ORIGIN: http://127.0.0.1:5188
      EMC_COOKIE_SECURE: "false"
      EMC_AGENT_GUEST_ENABLED: "true"
      EMC_AGENT_GUEST_ORIGINS: http://127.0.0.1:5188,http://localhost:5188
    volumes:
      - agent-uploads:/app/backend/var/uploads
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health')"]
      interval: 15s
      timeout: 5s
      retries: 5
  web:
    depends_on:
      api:
        condition: service_healthy
    image: nginx:1.28-alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:5188:80"
    volumes:
      - ../index.html:/usr/share/nginx/html/index.html:ro
      - ../assets:/usr/share/nginx/html/assets:ro
      - ../js:/usr/share/nginx/html/js:ro
      - ../css:/usr/share/nginx/html/css:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/healthz"]
      interval: 30s
      timeout: 3s
      retries: 3
  frpc:
    image: snowdreamtech/frpc:latest
    restart: unless-stopped
    command: ["-c", "/etc/frp/frpc.toml"]
    volumes:
      - ./frpc.toml:/etc/frp/frpc.toml:ro
    depends_on:
      web:
        condition: service_healthy

volumes:
  agent-db:
  agent-uploads:
