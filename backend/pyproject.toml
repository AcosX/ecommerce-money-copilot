[project]
name = "emc-api"
version = "0.1.0"
description = "电商搞钱参谋 V1 业务后端"
requires-python = "==3.12.*"
dependencies = [
    "fastapi==0.156.4",
    "uvicorn==0.54.0",
    "sqlalchemy==2.1.5",
    "alembic==1.20.0",
    "pymysql==1.2.3",
    "pydantic==2.14.1",
    "pydantic-settings==2.16.1",
    "httpx==0.28.1",
]

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "ruff==0.17.1",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
# PEP 695 泛型语法与 pydantic 泛型模型的配合暂不强制
ignore = ["UP046", "UP047"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI 依赖注入的标准写法
extend-immutable-calls = [
    "fastapi.Depends",
    "fastapi.Query",
    "fastapi.Header",
    "fastapi.params.Depends",
]
