# 开发/测试用 MariaDB 10.11（仅绑定 127.0.0.1）。密码等从 backend/.env 读取。
#   docker compose -f docker-compose.dev.yml up -d --wait
name: emc-dev

services:
  mariadb:
    image: mariadb:10.11
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: ${EMC_DEV_DB_ROOT_PASSWORD:?set EMC_DEV_DB_ROOT_PASSWORD in backend/.env}
      MARIADB_DATABASE: emc
      MARIADB_USER: emc
      MARIADB_PASSWORD: ${EMC_DEV_DB_PASSWORD:?set EMC_DEV_DB_PASSWORD in backend/.env}
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      # 与 Galera 要求一致
      - --innodb-autoinc-lock-mode=2
    ports:
      - "127.0.0.1:${EMC_DEV_DB_PORT:-3307}:3306"
    volumes:
      - emc-dev-mariadb:/var/lib/mysql
      - ./dev/mariadb-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 3s
      timeout: 5s
      retries: 40

volumes:
  emc-dev-mariadb:
