const names=['地摊起步','复古商车','日式精品店','工业旗舰店','未来商业街','未来百货地标'],scene=new T.Scene(),camera=new T.PerspectiveCamera(32,innerWidth/innerHeight,.01,100),renderer=new T.WebGLRenderer({antialias:true,preserveDrawingBuffer:true});renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));renderer.setClearColor('#eae8e3');renderer.toneMapping=T.ACESFilmicToneMapping;renderer.toneMappingExposure=1.08;const pmrem=new T.PMREMGenerator(renderer),room=new T.Scene();room.background=new T.Color('#a9a9a9');for(const [x,y,z,w,h,d,c]of[[0,5,0,8,.1,8,'#ffffff'],[-5,1,0,.1,5,8,'#d7deeb'],[4,2,1,.1,4,5,'#fff4df']]){const panel=new T.Mesh(new T.BoxGeometry(w,h,d),new T.MeshBasicMaterial({color:c}));panel.position.set(x,y,z);room.add(panel);}scene.environment=pmrem.fromScene(room,.04).texture;scene.environmentIntensity=.35;room.traverse(o=>{o.geometry?.dispose();o.material?.dispose()});pmrem.dispose();document.body.append(renderer.domElement);const controls=new OrbitControls(camera,renderer.domElement);controls.enableDamping=true;controls.target.set(0,1,0);scene.add(new T.HemisphereLight(0xffffff,0x8d929a,2.3));for(const [x,y,z,intensity]of[[4,6,4,2],[-4,3,-3,1.3]]){const light=new T.DirectionalLight(0xffffff,intensity);light.position.set(x,y,z);scene.add(light);}const floor=new T.Mesh(new T.PlaneGeometry(200,200),new T.MeshStandardMaterial({color:0xeae8e3,roughness:1}));floor.rotation.x=-Math.PI/2;floor.position.y=-.01;scene.add(floor);let current,level=0,loaded=false,stats={},epoch=0,dirty=true;const disposeModel=model=>{const textures=new Set(),materials=new Set(),geometries=new Set();model?.traverse(o=>{if(o.isMesh){geometries.add(o.geometry);for(const m of Array.isArray(o.material)?o.material:[o.material]){materials.add(m);for(const v of Object.values(m))if(v?.isTexture)textures.add(v);}}});for(const t of textures)t.dispose();for(const m of materials)m.dispose();for(const g of geometries)g.dispose();};controls.addEventListener('change',()=>{dirty=tr function view(back=false){const box=current?new T.Box3().setFromObject(current):new T.Box3(new T.Vector3(-1,0,-1),new T.Vector3(1,2,1)),sphere=box.getBoundingSphere(new T.Sphere()),center=sphere.center;const distance=sphere.radius/Math.sin(T.MathUtils.degToRad(camera.fov/2))*1.12;const dir=new T.Vector3(back?-1:1,.65,back?-1.25:1.25).normalize();camera.position.copy(center).addScaledVector(dir,distance);controls.target.copy(center);controls.update();}view();async function load(i){const token=++epoch;loaded=false;level=i;document.getElementById('status').textContent='正在加载 '+names[i];try{const gltf=await loader.loadAsync('../assets/models/buildings-v2/level-'+i+'-web.glb?v=source-restore3');if(token!==epoch){disposeModel(gltf.scene);return;}if(current){scene.remove(current);disposeModel(current);}current=gltf.scene;current.updateMatrixWorld(true);let box=new T.Box3().setFromObject(current),size=box.getSize(new T.Vector3()),scale=2.8/Math.max(size.x,size.y,size.z);current.scale.multiplyScalar(scale);current.updateMatrixWorld(true);box=new T.Box3().setFromObject(current);const center=box.getCenter(new T.Vector3());current.position.add(new T.Vector3(-center.x,-box.min.y,-center.z));scene.add(current);let meshes=0,textured=0,triangles=0;current.traverse(o=>{if(o.isMesh){meshes++;triangles+=(o.geometry.index?.count||o.geometry.attributes.position.count)/3;for(const m of Array.isArray(o.material)?o.material:[o.material])if(m.map)textured++;}});stats={meshes,textured,triangles};loaded=true;dirty=true;document.getElementById('status').textContent=`LV.${i} ${names[i]} · ${Math.round(triangles).toLocaleString()} 三角面 · ${textured} 带贴图材质 · 拖动旋转，滚轮缩放`;for(const b of document.querySelectorAll('[data-level]'))b.setAttribute('aria-pressed',String(+b.dataset.level===i));view();}catch(e){document.getElementById('status').textContent='加载失败：'+e.message;throw e;}}
for(let i=0;i<6;i++){const b=document.createElement('button');b.textContent='LV.'+i;b.dataset.level=i;b.onclick=()=>load(i);document.getElementById('levels').append(b);}document.getElementById('front').onclick=()=>view();document.getElementById('back').onclick=()=>view(true);window.buildingReview=()=>({loaded,level,...stats,gpu:{...renderer.info.memory}});window.loadBuilding=load;window.addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);dirty=true});renderer.setAnimationLoop(()=>{const changed=controls.update();if(dirty||changed){renderer.render(scene,camera);dirty=false;}});load(0);
