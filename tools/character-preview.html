*{box-sizing:border-box}body{margin:0;background:#f2efdf;color:#252947;font:13px/1.7 system-ui,sans-serif}header{height:86px;padding:18px 28px;border-bottom:1px solid #25294720;display:flex;justify-content:space-between;align-items:center}h1{margin:0;font-size:25px;font-weight:900}header p{margin:2px 0;color:#62687a;font-size:11px}main{height:calc(100svh - 86px);display:grid;grid-template-columns:minmax(0,1fr) 340px}#stage{min-width:0;position:relative;overflow:hidden}canvas{display:block;width:100%;height:100%;touch-action:none}aside{padding:22px;border-left:1px solid #25294720;overflow:auto;background:#fffbee}h2{font-size:12px;margin:22px 0 10px}h2:first-child{margin-top:0}.buttons{display:flex;gap:8px;flex-wrap:wrap}button,a{font:inherit;color:inherit;border:1px solid #25294770;background:transparent;padding:7px 10px;text-decoration:none;cursor:pointer}button[aria-pressed=true],a.primary{background:#ffe340;border-color:#252947}button:disabled{opacity:.45;cursor:wait}.viewbar{position:absolute;bottom:18px;left:22px;right:22px;display:flex;gap:8px;flex-wrap:wrap;z-index:2}.viewbar button{background:#fffbeeee}.viewbar button[aria-pressed=true]{background:#ffe340}#status{font-size:11px;color:#62687a;margin-top:18px}small{font-size:10px;color:#62687a}label{display:block;font-size:11px;margin:14px 0}input{width:100%;accent-color:#d4ae13}#stats{font-size:10px;color:#62687a}.downloads{display:flex;gap:8px;margin-top:20px}button:focus-visible,a:focus-visible{outline:3px solid #28a888;outline-offset:3px}@media(max-width:700px){header{height:72px;padding:12px 18px}h1{font-size:21px}#stats{max-width:120px;text-align:right}main{height:calc(100svh - 72px);grid-template-columns:1fr;grid-template-rows:minmax(220px,1fr) 265px}aside{border-left:0;border-top:1px solid #25294720;padding:16px 18px}h2{margin:15px 0 8px}.viewbar{left:16px;bottom:12px;gap:6px}.viewbar button{font-size:11px;padding:6px 8px}.downloads{margin-top:15px}}

<header><div><h1>小商 · 表情与嘴型</h1><p>细像素服装 · 连续面部网格 · 拖动旋转 / 双指缩放</p></div><div id="stats">准备模型…</div></header>
<main><section id="stage" aria-label="可旋转的小商模型"><div class="viewbar"><button id="closeup" aria-pressed="true">面部近景</button><button id="fullbody" aria-pressed="false">全身 T 姿</button><button id="detail" aria-pressed="true">高清</button><button id="lite" aria-pressed="false">流畅</button></div></section>
<aside aria-label="表情控制"><h2>情绪 · 可与说话叠加</h2><div class="buttons" id="emotions"></div><h2>基础嘴型</h2><div class="buttons" id="visemes"></div><div class="buttons" style="margin-top:10px"><button id="talk" aria-pressed="false">嘴型循环演示</button><button id="blink" aria-pressed="true">自然眨眼</button></div><small>循环仅演示形态键，尚未接入真实语音时间轴。</small>
<h2>上下唇独立控制</h2><div id="lipControls"></div><label>下颌开合<input id="jawAmount" aria-label="下颌开合" type="range" min="0" max="100" value="0"></label><label>眨眼强度<input id="blinkAmount" aria-label="眨眼强度" type="range" min="0" max="100" value="0"></label><button id="reset">恢复自然状态</button>
<div id="status" role="status">正在加载模型…</div><div class="downloads"><a id="download" class="primary" download>下载 GLB</a><a href="../assets/models/characters/xiaoshang-expressive-v2.blend" download>Blender 源文件</a></div><p><small>独立资产预览。浮岛中的角色、行为与语音驱动尚未替换。</small></p></aside></main>
<script type="module">
import * as THREE from 'three';import {OrbitControls} from 'three/addons/controls/OrbitControls.js';import {GLTFLoader} from 'three/addons/loaders/GLTFLoader.js';import {createCharacterFace,FACE_EMOTIONS,FACE_VISEMES} from '../js/emc-character-face.js';
const stage=document.getElementById('stage'),status=document.getElementById('status'),renderer=new THREE.WebGLRenderer({antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));renderer.setClearColor(0xf2efdf);renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.1;stage.prepend(renderer.domElement);
const scene=new THREE.Scene(),camera=new THREE.PerspectiveCamera(32,1,.01,100),controls=new OrbitControls(camera,renderer.domElement);controls.enableDamping=true;controls.enablePan=false;controls.minDistance=.35;controls.maxDistance=10;scene.add(new THREE.HemisphereLight(0xffffff,0x9a9dab,2.3));const key=new THREE.DirectionalLight(0xfff6e7,1.2);key.position.set(4,5,3);scene.add(key);const fill=new THREE.DirectionalLight(0xe2edff,.7);fill.position.set(-2,2,-4);scene.add(fill);
let model=null,face=null,profile='detail',view='closeup',loaded=false,token=0,last=0,clock=0,talking=false,blinkEnabled=true,spokenStep=-1;const reduce=matchMedia('(prefers-reduced-motion: reduce)');
const emotionLabels={neutral:'自然',friendly:'亲切',happy:'开心',thinking:'思考',worried:'担心',surprised:'惊讶'},visemeLabels={sil:'停顿',aa:'A',ih:'I',ou:'U',ee:'E',oh:'O',mbp:'M/B/P',fv:'F/V'};
for(const [id,label] of Object.entries(emotionLabels)){const b=document.createElement('button');b.textContent=label;b.dataset.emotion=id;b.setAttribute('aria-pressed',String(id==='neutral'));document.getElementById('emotions').append(b);b.onclick=()=>{clearLipSliders();face?.clearOverrides();face?.setEmotion(id);select('emotion',id);};}
for(const id of FACE_VISEMES){const b=document.createElement('button');b.textContent=visemeLabels[id];b.dataset.viseme=id;b.setAttribute('aria-pressed',String(id==='sil'));document.getElementById('visemes').append(b);b.onclick=()=>{stopTalk();clearLipSliders();face?.clearOverrides();face?.setViseme(id);select('viseme',id);};}
function select(type,id){document.querySelectorAll('[data-'+type+']').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset[type]===id)));}
const lipValues={upperRaise:0,upperPress:0,lowerDrop:0,lowerPress:0,jaw:0};
for(const [id,label] of Object.entries({upperRaise:'上唇抬起',upperPress:'上唇压合',lowerDrop:'下唇下拉',lowerPress:'下唇压合'})){
 const wrapper=document.createElement('label');wrapper.textContent=label;const input=document.createElement('input');input.type='range';input.min=0;input.max=100;input.value=0;input.id=id;input.setAttribute('aria-label',label);wrapper.append(input);document.getElementById('lipControls').append(wrapper);
 input.oninput=()=>{stopTalk();lipValues[id]=input.value/100;face?.setLipControls(lipValues);select('viseme','sil');};
}
function resize(){const r=stage.getBoundingClientRect();renderer.setSize(r.width,r.height);camera.aspect=r.width/r.height;camera.updateProjectionMatrix();}new ResizeObserver(resize).observe(stage);resize();
function frameView(next){view=next;if(next==='closeup'){camera.position.set(.92,1.55,.035);controls.target.set(.03,1.52,0);}else{const distance=2.2/Math.min(1,camera.aspect);camera.position.set(distance*1.45,.95,distance*.18);controls.target.set(0,.88,0);}controls.update();for(const id of ['closeup','fullbody'])document.getElementById(id).setAttribute('aria-pressed',String(id===next));}
function dispose(root){const materials=new Set(),textures=new Set();root?.traverse(o=>{o.geometry?.dispose();for(const m of o.material?(Array.isArray(o.material)?o.material:[o.material]):[]){materials.add(m);for(const v of Object.values(m))if(v?.isTexture)textures.add(v);}});textures.forEach(t=>t.dispose());materials.forEach(m=>m.dispose());}
async function load(next){const ticket=++token;loaded=false;document.querySelectorAll('button').forEach(b=>b.disabled=true);status.textContent='正在加载模型…';try{const url='../assets/models/characters/xiaoshang-expressive-v2-'+(next==='detail'?'web':'lite')+'.glb?mouth=separate-lips-v3';const gltf=await new GLTFLoader().loadAsync(url);if(ticket!==token){dispose(gltf.scene);return;}if(model){scene.remove(model);dispose(model);}model=gltf.scene;scene.add(model);profile=next;face=createCharacterFace(model,{autoBlink:blinkEnabled});face.update(0,{instant:true});frameView(view);let bones=0;model.traverse(o=>{if(o.isBone)bones++;});document.getElementById('stats').textContent=face.names.length+' 个形态键 · '+bones+' 根骨骼';document.getElementById('download').href=url;for(const id of ['detail','lite'])document.getElementById(id).setAttribute('aria-pressed',String(id===next));reset();status.textContent='模型已就绪。眼、眉、嘴可独立控制，已保留后续语音驱动接口。';loaded=true;}catch(e){status.textContent='加载失败：'+e.message;}finally{if(ticket===token)document.querySelectorAll('button').forEach(b=>b.disabled=false);}}
function clearLipSliders(){for(const id of Object.keys(lipValues)){lipValues[id]=0;const input=document.getElementById(id==='jaw'?'jawAmount':id);if(input)input.value=0;}}
function stopTalk(){talking=false;document.getElementById('talk').setAttribute('aria-pressed','false');}
function reset(){stopTalk();face?.clearOverrides();face?.setEmotion('neutral');face?.setViseme('sil');face?.setAutoBlink(blinkEnabled);select('emotion','neutral');select('viseme','sil');document.getElementById('blinkAmount').value=0;document.getElementById('jawAmount').value=0;for(const key of Object.keys(lipValues)){lipValues[key]=0;const input=document.getElementById(key);if(input)input.value=0;}}
document.getElementById('closeup').onclick=()=>frameView('closeup');document.getElementById('fullbody').onclick=()=>frameView('fullbody');document.getElementById('detail').onclick=()=>load('detail');document.getElementById('lite').onclick=()=>load('lite');document.getElementById('reset').onclick=reset;document.getElementById('talk').onclick=()=>{talking=!talking;spokenStep=-1;clearLipSliders();face?.clearOverrides();document.getElementById('talk').setAttribute('aria-pressed',String(talking));if(!talking){face?.setViseme('sil');select('viseme','sil');}};
document.getElementById('blink').onclick=()=>{blinkEnabled=!blinkEnabled;face?.setAutoBlink(blinkEnabled);document.getElementById('blink').setAttribute('aria-pressed',String(blinkEnabled));};document.getElementById('blinkAmount').oninput=e=>{face?.setMorph('eyeBlinkLeft',e.target.value/100);face?.setMorph('eyeBlinkRight',e.target.value/100);};document.getElementById('jawAmount').oninput=e=>{stopTalk();lipValues.jaw=e.target.value/100;face?.setLipControls(lipValues);select('viseme','sil');};
function frame(now){requestAnimationFrame(frame);if(document.hidden||now-last<33)return;const dt=Math.min(.1,(now-last)/1000||.033);last=now;clock+=dt;if(talking&&face){const step=Math.floor(clock/.28);if(step!==spokenStep){spokenStep=step;const id=FACE_VISEMES[step%FACE_VISEMES.length];face.setViseme(id,.85);select('viseme',id);}}face?.update(dt,{instant:reduce.matches});controls.update();renderer.render(scene,camera);}requestAnimationFrame(frame);
window.characterPreviewState=()=>({loaded,profile,view,talking,face:face?.state(),morphs:face?.names,bones:model?(()=>{let n=0;model.traverse(o=>{if(o.isBone)n++;});return n;})():0,triangles:renderer.info.render.triangles});
window.characterPreviewProbe=()=>{const result={face:[],body:[]};model?.updateMatrixWorld(true);model?.traverse(o=>{if(!o.isSkinnedMesh)return;o.skeleton.update();const kind=o.morphTargetDictionary?'face':'body',count=o.geometry.attributes.position.count;for(let i=0;i<count;i+=Math.ceil(count/500)){const p=new THREE.Vector3();o.getVertexPosition(i,p);p.applyMatrix4(o.matrixWorld);result[kind].push(p.toArray());}});return result;};
window.characterLipProbe=()=>{const result={upper:[],lower:[],teeth:[]};model?.updateMatrixWorld(true);model?.traverse(o=>{if(!o.isSkinnedMesh)return;const lip=o.material?.name.startsWith('Soft lip edge'),teeth=o.material?.name.startsWith('Upper teeth');if(!lip&&!teeth)return;o.skeleton.update();for(let i=0;i<o.geometry.attributes.position.count;i++){const base=new THREE.Vector3().fromBufferAttribute(o.geometry.attributes.position,i),p=new THREE.Vector3();o.applyBoneTransform(i,base);base.applyMatrix4(o.matrixWorld);o.getVertexPosition(i,p);p.applyMatrix4(o.matrixWorld);const side=(-base.z+.003685156)/.032,offset=base.y-(1.451953365+.002*side*side);if(teeth)result.teeth.push(p.toArray());else if(Math.abs(offset)>.00015)result[offset>0?'upper':'lower'].push(p.toArray());}});return result;};
window.characterInspectMorph=name=>{stopTalk();face.setAutoBlink(false);face.setEmotion('neutral',0);face.setViseme('sil');face.clearOverrides();for(const key of face.names)face.setMorph(key,key===name?1:0);face.update(0,{instant:true});};load('detail');
</script></body></html>
