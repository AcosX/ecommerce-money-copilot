window.characterSeatProbe=()=>{model.updateMatrixWorld(true);const body=[];model.traverse(o=>{if(o.isSkinnedMesh&&!o.morphTargetDictionary){o.skeleton.update();o.computeBoundingSphere();body.push(o);}});return [-.08,.08].map(z=>{const ray=new THREE.Raycaster(new THREE.Vector3(.04,-.20,z),new THREE.Vector3(0,1,0),0,1.1);const hit=ray.intersectObjects(body,false)[0];return hit?{x:hit.point.x,z:hit.point.z,gap:hit.point.y}:null;});};
window.characterMotionProbe=()=>{const state={minY:Infinity,maxY:-Infinity};model.updateMatrixWorld(true);model.traverse(o=>{if(!o.isSkinnedMesh)return;o.skeleton.update();for(let i=0;i<o.geometry.attributes.position.count;i++){const p=new THREE.Vector3();o.getVertexPosition(i,p);p.applyMatrix4(o.matrixWorld);state.minY=Math.min(state.minY,p.y);state.maxY=Math.max(state.maxY,p.y);}});return state;};
window.characterShoulderProbe=()=>{model.updateMatrixWorld(true);const points=[];for(const suffix of ['0_Right_Limb_0','1_Left_Limb_0']){let bone;model.traverse(o=>{if(o.isBone&&o.name.endsWith(suffix))bone=o;});points.push(bone.getWorldPosition(new THREE.Vector3()));}return {width:points[0].distanceTo(points[1]),heights:points.map(p=>p.y)};};
window.characterInspectMorph=name=>{stopTalk();face.setAutoBlink(false);face.setEmotion('neutral',0);face.setViseme('sil');face.clearOverrides();for(const key of face.names)face.setMorph(key,key===name?1:0);face.update(0,{instant:true});};load('detail');
</script></body></html>
