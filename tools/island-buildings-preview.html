const draft={wall_color:'#eee0c5',sign_color:'#9c531e',roof_color:'#bd3f23',placements:[]};let current,token=0;window.loadIslandBuilding=async level=>{const id=++token;upgrade.disabled=true;window.islandBuildingReady=null;document.querySelector('#load-error').hidden=true;current?.dispose();document.querySelector('#status').textContent='加载 Lv.'+level;current=new ShopScene(document.querySelector('#scene'),{stage:Math.max(1,level),modelLevel:level,quality:showcase.state.quality,draft,shopName:'电商搞钱参谋示范店',night:false});window.islandBuilding=current;try{await current.ready;if(token!==id)return;await current.prepareFrame();if(token!==id)return;}catch(error){if(id!==token)return;document.querySelector('#load-error').hidden=false;document.querySelector('#load-error span').textContent=error.message;document.querySelector('#retry-island').onclick=()=>loadIslandBuilding(level);return;}document.querySelector('#status').textContent='Lv.'+level+' · '+current.buildingEntry.name;showcase.setLevel(level);window.islandBuildingReady=level;upgrade.disabled=level>=5;};for(let i=0;i<6;i++){const b=document.createElement('button');b.textContent='Lv.'+i;b.onclick=()=>loadIslandBuilding(i);document.querySelector('#levels').append(b);}const upgrade=document.createElement('button');upgrade.id='upgrade';upgrade.textContent='播放升级 →';upgrade.onclick=async()=>{

 }catch(error){

  document.querySelector('#retry-island').onclick=()=>upgrade.click();
 }finally{if(id===token)upgrade.disabled=instance.modelLevel>=5;}
};document.querySelector('#levels').append(upgrade);window.render_game_to_text=()=>JSON.stringify({level:current?.modelLevel,upgrade:current?.upgradeEffect?.state()||null,audio:audio.state()});loadIslandBuilding(showcase.state.level);
