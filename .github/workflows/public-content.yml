name: Public content checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Export tracked files (exclude local private context)
        run: |
          mkdir "$RUNNER_TEMP/public-tree"
          git archive HEAD | tar -x -C "$RUNNER_TEMP/public-tree"
      - name: Install pinned Gitleaks
        run: |
          curl --fail --silent --show-error --location \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
            --output "$RUNNER_TEMP/gitleaks.tar.gz"
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $RUNNER_TEMP/gitleaks.tar.gz" | sha256sum --check
          tar --no-same-owner -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP" gitleaks
      - name: Scan tracked files and bundled archives
        run: >-
          "$RUNNER_TEMP/gitleaks" dir "$RUNNER_TEMP/public-tree"
          --redact=100 --max-archive-depth=3 --max-decode-depth=2
