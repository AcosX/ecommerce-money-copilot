name: Project checks

on:
  push:
    branches: [main, feat/pixel-island-account]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frontend-unit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test js/tests/*.test.cjs

  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    services:
      mariadb:
        image: mariadb:10.11
        env:
          MARIADB_ROOT_PASSWORD: ci-test-password
          MARIADB_ROOT_HOST: '%'
          MARIADB_DATABASE: emc
        ports:
          - 3307:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s --health-timeout=5s --health-retries=20
    env:
      EMC_TEST_DATABASE_URL: mysql+pymysql://root:ci-test-password@127.0.0.1:3307/emc?charset=utf8mb4
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install uv==0.10.9
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest -q --tb=short
