name: Project checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frontend-unit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node js/tests/check-syntax.cjs
      - run: node --test js/tests/*.test.cjs

  frontend-ui:
    strategy:
      fail-fast: false
      matrix:
        suite: [journey, showcase, evolution]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      EMC_TEST_URL: http://127.0.0.1:5173/
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --prefix "$RUNNER_TEMP/emc-browser" --no-save --package-lock=false playwright@1.56.1
      - run: node "$RUNNER_TEMP/emc-browser/node_modules/playwright/cli.js" install --with-deps chromium
      - name: Browser regression (${{ matrix.suite }})
        env:
          EMC_PLAYWRIGHT_MODULE: ${{ runner.temp }}/emc-browser/node_modules/playwright
          EMC_SCREENSHOTS: ${{ runner.temp }}/emc-ui-shots
          EMC_UI_SUITE: ${{ matrix.suite }}
        run: |
          python3 -m http.server 5173 --bind 127.0.0.1 > "$RUNNER_TEMP/emc-static.log" 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          export EMC_CHROMIUM="$(node -e 'process.stdout.write(require(process.env.EMC_PLAYWRIGHT_MODULE).chromium.executablePath())')"
          case "$EMC_UI_SUITE" in
            journey)
              node js/tests/emc-report-examples-browser.cjs
              node js/tests/emc-journal-prompts-browser.cjs
              node js/tests/emc-centered-panels-browser.cjs
              node js/tests/emc-chat-composer-browser.cjs
              node js/tests/emc-chat-upgrade-browser.cjs
              node js/tests/emc-partner-browser.cjs
              ;;
            showcase) node js/tests/emc-model-showcase-browser.cjs ;;
            evolution) node js/tests/emc-building-evolution-browser.cjs ;;
          esac
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: frontend-ui-screenshots-${{ matrix.suite }}
          path: ${{ runner.temp }}/emc-ui-shots
          if-no-files-found: ignore

  frontend-regressions:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        suite: [mobile-layout, scene-recovery]
    env:
      EMC_TEST_URL: http://127.0.0.1:5173/
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --prefix "$RUNNER_TEMP/emc-browser" --no-save --package-lock=false playwright@1.56.1
      - run: node "$RUNNER_TEMP/emc-browser/node_modules/playwright/cli.js" install --with-deps chromium
      - name: Run ${{ matrix.suite }} in Chromium
        env:
          SUITE: ${{ matrix.suite }}
          EMC_PLAYWRIGHT_MODULE: ${{ runner.temp }}/emc-browser/node_modules/playwright
          EMC_MOBILE_SHOTS: ${{ runner.temp }}/emc-regression-shots
        run: |
          python3 -m http.server 5173 --bind 127.0.0.1 > "$RUNNER_TEMP/emc-static.log" 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent "$EMC_TEST_URL" > /dev/null; then break; fi
            sleep 1
          done
          curl --fail --silent "$EMC_TEST_URL" > /dev/null
          export EMC_CHROMIUM="$(node -e 'process.stdout.write(require(process.env.EMC_PLAYWRIGHT_MODULE).chromium.executablePath())')"
          node "js/tests/emc-${SUITE}-browser.cjs"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: frontend-${{ matrix.suite }}-screenshots
          path: ${{ runner.temp }}/emc-regression-shots
          if-no-files-found: ignore

  local-stack:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build, start and upload through the local Nginx stack
        run: python deploy/tests/smoke_local_stack.py

  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    services:
      mariadb:
        image: mariadb:10.11
        env:
          MARIADB_ROOT_PASSWORD: ci-test-password
          MARIADB_ROOT_HOST: '%'
          MARIADB_DATABASE: emc
        ports:
          - 3307:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s --health-timeout=5s --health-retries=20
    env:
      EMC_TEST_DATABASE_URL: mysql+pymysql://root:ci-test-password@127.0.0.1:3307/emc?charset=utf8mb4
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install uv==0.10.9
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest -q --tb=short
